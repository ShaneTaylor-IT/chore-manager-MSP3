{% extends 'base.html' %}

{% block content %}
    <h1>Delete Chore</h1>
    <p>Are you sure you want to delete:</p>
    <p><strong>{{ chore.title }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'chores' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
