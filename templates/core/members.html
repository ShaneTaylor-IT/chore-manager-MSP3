{% extends 'base.html' %}

{% block content %}
    <h1>Members</h1>
    <ul>
        {% for member in members %}
            <li>
                <strong>{{ member.display_name }}</strong><br>
                Role: {{ member.role }}<br>
                Household: {{ member.household.name }}<br>
                <a href="{% url 'edit_member' member.id %}" class="btn btn-warning">Edit</a>
                <a href="{% url 'delete_member' member.id %}" class="btn btn-danger">Delete</a>
            </li>
        {% empty %}
            <li>No members found.</li>
        {% endfor %}
    </ul>
{% endblock %}
