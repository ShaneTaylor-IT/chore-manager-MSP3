{% extends 'base.html' %}

{% block content %}
    <h1>Delete Member</h1>
    <p>Are you sure you want to delete {{ member.display_name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'members' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
